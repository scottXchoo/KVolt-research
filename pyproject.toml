[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "kvolt-runtime"
version = "0.1.0"
description = "KVolt experimental inference runtime"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: opt-in AGX1 backend correctness qualification"]
