[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "kvolt-runtime"
version = "0.1.0"
description = "KVolt experimental inference runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
policy = ["numpy==1.26.4", "scipy==1.15.3", "kneed==0.9.0"]

[project.scripts]
kvolt = "kvolt_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kvolt_runtime.backend.vendor" = ["LICENSE.KIVI"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: opt-in AGX1 backend correctness qualification"]
